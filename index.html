<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>AI在宅ワーク参加特典</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f2f2f0;
      --surface: #ffffff;
      --text: #202020;
      --border: #d8d8d5;
      --focus: #303030;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 72px 0 96px;
    }

    h1 {
      margin: 0 0 48px;
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.2;
      letter-spacing: -0.035em;
    }

    .bonuses {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 40px 32px;
    }

    .bonus {
      min-width: 0;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .thumbnail { display: block; }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    .url {
      display: block;
      margin-top: 16px;
      color: var(--text);
      font-size: 16px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      text-underline-offset: 0.18em;
    }

    a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    @media (max-width: 700px) {
      main {
        width: min(100% - 32px, 1120px);
        padding: 44px 0 64px;
      }

      h1 { margin-bottom: 32px; }

      .bonuses {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .bonus { padding: 12px; }
    }

    @media (max-width: 350px) {
      h1 {
        font-size: 28px;
        letter-spacing: -0.045em;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>AI在宅ワーク参加特典</h1>
    <section class="bonuses" aria-label="参加特典一覧">
      <article class="bonus">
        <a class="thumbnail" href="https://yuuyann0318.github.io/ai-fukugyo-startbook-50/" aria-label="AI副業スタートBOOKを開く">
          <img src="assets/display/01-start-book-v6.jpg" alt="AI副業スタートBOOKのサムネイル" fetchpriority="high">
        </a>
        <a class="url" href="https://yuuyann0318.github.io/ai-fukugyo-startbook-50/">https://yuuyann0318.github.io/ai-fukugyo-startbook-50/</a>
      </article>
      <article class="bonus">
        <a class="thumbnail" href="https://yuuyann0318.github.io/ai-fukugyo-shindan-50/" aria-label="AI副業8問診断を開く">
          <img src="assets/display/02-ai-sidejob-diagnosis-v6.jpg" alt="AI副業8問診断のサムネイル" loading="lazy">
        </a>
        <a class="url" href="https://yuuyann0318.github.io/ai-fukugyo-shindan-50/">https://yuuyann0318.github.io/ai-fukugyo-shindan-50/</a>
      </article>
      <article class="bonus">
        <a class="thumbnail" href="https://yuuyann0318.github.io/smartphone-ai-design-guide/" aria-label="スマホAIデザインガイドを開く">
          <img src="assets/display/03-smartphone-design-v6.jpg" alt="スマホAIデザインガイドのサムネイル" loading="lazy">
        </a>
        <a class="url" href="https://yuuyann0318.github.io/smartphone-ai-design-guide/">https://yuuyann0318.github.io/smartphone-ai-design-guide/</a>
      </article>
      <article class="bonus">
        <a class="thumbnail" href="https://yuuyann0318.github.io/ai-automation-work-guide/" aria-label="AI自動化ワークガイドを開く">
          <img src="assets/display/04-ai-automation-work-v6.jpg" alt="AI自動化ワークガイドのサムネイル" loading="lazy">
        </a>
        <a class="url" href="https://yuuyann0318.github.io/ai-automation-work-guide/">https://yuuyann0318.github.io/ai-automation-work-guide/</a>
      </article>
      <article class="bonus">
        <a class="thumbnail" href="https://yuuyann0318.github.io/codex-video-editing-kit/" aria-label="動画編集キット導入ガイドを開く">
          <img src="assets/display/05-chatgpt-full-auto-video-editing-kit-v6.jpg" alt="動画編集キット導入ガイドのサムネイル" loading="lazy">
        </a>
        <a class="url" href="https://yuuyann0318.github.io/codex-video-editing-kit/">https://yuuyann0318.github.io/codex-video-editing-kit/</a>
      </article>
    </section>
  </main>
</body>
</html>
